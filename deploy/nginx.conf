# مثال لإعداد nginx — غيّر example.com لدومينك، وفعّل HTTPS بـ certbot
server {
	server_name primecleardrains.novaslash.com;
	root /var/www/drain-kuwait;
	index index.html;

	location / {
		try_files $uri $uri/ $uri.html =404;
	}

	# تسجيل الدخول للوحة التحكم
	location /api/ {
		proxy_pass http://127.0.0.1:3005/;
		proxy_set_header Host $host;
	}
}
