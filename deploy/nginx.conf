# مثال لإعداد nginx — غيّر example.com لدومينك، وفعّل HTTPS بـ certbot
server {
	server_name primecleardrains.novaslash.com;
	root /var/www/drain-kuwait;
	index index.html;

	# إخفاء رقم إصدار nginx من هيدر Server وصفحات الأخطاء
	server_tokens off;

	# Content-Type: text/html; charset=utf-8 (وباقي الملفات النصية)
	charset utf-8;
	charset_types text/css text/plain text/xml application/javascript application/json application/rss+xml application/manifest+json image/svg+xml;

	# الضغط: text/html بيتضغط دايمًا، والباقي لازم يتحدد
	gzip on;
	gzip_vary on;
	gzip_comp_level 6;
	gzip_min_length 256;
	gzip_types text/css text/plain text/xml application/javascript application/json application/rss+xml application/xml application/manifest+json image/svg+xml;

	location / {
		try_files $uri $uri/ $uri.html =404;
	}

	# تسجيل الدخول للوحة التحكم
	location /api/ {
		proxy_pass http://127.0.0.1:3055/;
		proxy_set_header Host $host;
	}
}
